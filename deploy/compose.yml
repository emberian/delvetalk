# deploy/compose.yml: DelveTalk on the workhorse, in the shape of dregg-infra's
# edge/compose/docker-compose.yml. Read docs/DEPLOY.md before the first `up`.
#
#   scp deploy/compose.yml root@workhorse:/opt/delvetalk/compose.yml
#   ssh root@workhorse 'cd /opt/delvetalk && docker compose --profile town up -d --wait --remove-orphans'  # town: the interpreter, which needs the model key
#
# THE PROXY IS NOT HERE, as on the edge: native Caddy on the anchor terminates
# TLS for gsb.fg-goose.online and its `reverse_proxy 10.10.1.10:8765`
# (dregg-infra edge/delvetalk/route.caddy, merged into edge/anchor/Caddyfile)
# reaches the port below over the private net. There are no proxy labels to set:
# the edge uses no label-driven proxy. Port 8765 is the one that route already
# names, so the Caddy route needs no change; the old systemd
# delvetalk-proxy.socket listens on the same address and must be stopped first.
#
# ONE WRITER PER DIRECTORY. `delvetalk-host` is `delvetalk-obend serve` (`python3 -m transport serve`
# execs it with the config's sockets, opener and library), the
# only process that opens a journal. It holds /data/state/journal.lock for its
# life (exit 75 if taken), keeps every world's journal in /data/state
# (`town.journal`, `<world>.journal`, scratch/) and serves the HTTP front, the
# bridge and the interpreter over /data/state/host.sock, so they are plain
# clients and may start, stop and restart without touching the world. The
# opener's ops and world-root take the root socket, /run/delvetalk-root/root.sock,
# a separate host directory mounted into delvetalk-host, delvetalk-ops and the
# hand (compose.hand.yml) and into nothing else: the opener's authority is a mount.
#
# ONE CONFIG. Every service is `python3 -m transport <command>` over /data/state, configured by
# /data/state/delvetalk.toml (the operator's choices; optional) and the DELVETALK_<FIELD> variables below,
# which say only what is a fact of the containers (mount paths, secret files, listening addresses) or comes
# from .env (origin, opener, ports). transport/config.py lists every field.
#
# Every shell `$` in this file would be compose's; there are no shell bodies.

name: delvetalk

x-env: &env
  DELVETALK_STATE: /data/state
  DELVETALK_ROOT_SOCKET: /run/delvetalk-root/root.sock
  DELVETALK_ORIGIN: ${DELVETALK_ORIGIN:-https://gsb.fg-goose.online}
  DELVETALK_OPENER: ${DELVETALK_OPENER:-did:plc:6amo7col5h4ciq2gpm5eur7b}

x-service: &service
  image: ${DELVETALK_IMAGE:-delvetalk:current}
  restart: unless-stopped
  user: "10425:10425"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m,uid=10425,gid=10425
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  init: true
  stop_grace_period: 30s
  environment: *env
  volumes:
    # The clients (front, bridge, interpreter) mount state/ only: serve's
    # directory (town.journal, journal.lock, scratch/, library/, host.sock) and
    # the transport's files (transport/state.py: identity.sqlite, access.log,
    # worlds/<world>/). The host and ops mount all of /data. A host path, not a
    # named volume, as the edge keeps /var/lib/dregg/<service>: it is what
    # deploy/backup.sh reads.
    - ${DELVETALK_DATA:-/var/lib/delvetalk/v11}/state:/data/state
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  # The single writer: every world's journal and every principal's scratch worlds, in one process.
  delvetalk-host:
    <<: *service
    command: ["python3", "-m", "transport", "serve"]
    network_mode: none  # unix sockets only: the host never opens a network connection
    volumes:
      - ${DELVETALK_DATA:-/var/lib/delvetalk/v11}:/data
      - ${DELVETALK_ROOT:-/var/lib/delvetalk/root}:/run/delvetalk-root
    # Replay at a world's first op recompiles every created object (~0.2 to 1 s
    # each); a world idle ten minutes is closed and reopened by replay. The old
    # systemd unit's measured need was about 62 MiB RSS for a tiny world.
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      # The question only a live host can answer: its journal height (none when world-open refused the journal).
      test: ["CMD", "python3", "-m", "transport", "status", "--health", "host"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # The HTTP front: /AGENTS.md for agents, / and /o/<object> for people.
  # 0.0.0.0 inside the container; the port mapping binds the private address
  # only. trust_proxy keys the unauthenticated limits on the last
  # X-Forwarded-For entry, which Caddy on the anchor sets; anything else on
  # 10.10.1.0/24 that reaches the port directly can choose that entry.
  delvetalk-http:
    <<: *service
    command: ["python3", "-m", "transport", "http"]
    environment:
      <<: *env
      DELVETALK_HTTP_BIND: 0.0.0.0
      DELVETALK_HTTP_PORT: ${DELVETALK_HTTP_PORT:-8765}  # another port: a drill or rehearsal beside a live stack
      DELVETALK_TRUST_PROXY: "on"
    volumes:
      - ${DELVETALK_DATA:-/var/lib/delvetalk/v11}/state:/data/state
      # The repositories' signing keys, <world>.key (`transport repokey`; docs/REPO.md "The key"), at the config's default path.
      - ${DELVETALK_REPO_KEYS:-/etc/delvetalk/repo}:/etc/delvetalk/repo:ro
    ports:
      - "${DELVETALK_PRIVATE_IP:-10.10.1.10}:${DELVETALK_HTTP_PORT:-8765}:${DELVETALK_HTTP_PORT:-8765}/tcp"
    depends_on:
      delvetalk-host: { condition: service_healthy }
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      # The guide, then the question only a live host can answer: the home page's `entry <n>`.
      test: ["CMD", "python3", "-m", "transport", "status", "--health", "http"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Observe the town, run a turn per new spell or reply, write drafts to the
  # world's outbox. Reads the AppView and PDS only: transport/delve.py refuses
  # every non-GET unless built for posting, and no posting credential is mounted here.
  delvetalk-bridge:
    <<: *service
    command: ["python3", "-m", "transport", "bridge"]
    depends_on:
      delvetalk-host: { condition: service_healthy }
    mem_limit: 1g
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      # The daemon touches its pid file after every finished step: older than three polls means the loop is stuck.
      test: ["CMD", "python3", "-m", "transport", "status", "--health", "bridge"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Pending interpretation requests -> one model call each -> settled.
  delvetalk-interpret:
    <<: *service
    profiles: ["town"]
    command: ["python3", "-m", "transport", "interpret"]
    environment:
      <<: *env
      DELVETALK_ANTHROPIC_KEY_FILE: /run/secrets/anthropic_key
    secrets: [anthropic_key]
    mem_limit: 1g
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python3", "-m", "transport", "status", "--health", "interpret"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Operator commands, never started by `up`; the root socket and the key directory are mounted here:
  #   docker compose run --rm delvetalk-ops python3 -m deploy.genesis --root-socket /run/delvetalk-root/root.sock
  #   docker compose run --rm delvetalk-ops python3 -m transport hand outbox
  delvetalk-ops:
    <<: *service
    profiles: ["ops"]
    restart: "no"
    command: ["python3", "-m", "transport", "--help"]
    environment:
      <<: *env
      # Every data directory, read only: genesis refuses while a town lives in any (deploy/genesis.py, no wipe).
      DELVETALK_TOWNS: /towns
    volumes:
      - ${DELVETALK_DATA:-/var/lib/delvetalk/v11}:/data
      - ${DELVETALK_ROOT:-/var/lib/delvetalk/root}:/run/delvetalk-root
      - ${DELVETALK_REPO_KEYS:-/etc/delvetalk/repo}:/etc/delvetalk/repo
      - ${DELVETALK_TOWNS:-/var/lib/delvetalk}:/towns:ro

secrets:
  anthropic_key:
    # Outside the repository and outside /data, readable by uid 10425 only.
    file: ${DELVETALK_ANTHROPIC_KEY_PATH:-/etc/delvetalk/anthropic.key}
