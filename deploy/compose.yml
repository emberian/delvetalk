# deploy/compose.yml: DelveTalk on the workhorse, in the shape of dregg-infra's
# edge/compose/docker-compose.yml. Read docs/DEPLOY.md before the first `up`.
#
#   scp deploy/compose.yml root@workhorse:/opt/delvetalk/compose.yml
#   ssh root@workhorse 'cd /opt/delvetalk && docker compose --profile town up -d --wait --remove-orphans'  # town: the interpreter, which needs the model key
#
# THE PROXY IS NOT HERE, as on the edge: native Caddy on the anchor terminates
# TLS for gsb.fg-goose.online and its `reverse_proxy 10.10.1.10:8765`
# (dregg-infra edge/delvetalk/route.caddy, merged into edge/anchor/Caddyfile)
# reaches the port below over the private net. There are no proxy labels to set:
# the edge uses no label-driven proxy. Port 8765 is the one that route already
# names, so the Caddy route needs no change; the old systemd
# delvetalk-proxy.socket listens on the same address and must be stopped first.
#
# ONE WRITER PER DIRECTORY. `delvetalk-host` is `delvetalk-obend serve`, the
# only process that opens a journal. It holds /data/state/journal.lock for its
# life (exit 75 if taken), keeps every world's journal in /data/state
# (`town.journal`, `<world>.journal`, scratch/) and serves the HTTP front, the
# bridge and the interpreter over /data/state/host.sock, so they are plain
# clients and may start, stop and restart without touching the world. The
# opener's ops and world-root take the root socket, /run/delvetalk-root/root.sock,
# a separate host directory mounted into delvetalk-host, delvetalk-ops and the
# hand (compose.hand.yml) and into nothing else: the opener's authority is a mount.
#
# Every shell `$` in this file would be compose's; there are no shell bodies.

name: delvetalk

x-service: &service
  image: ${DELVETALK_IMAGE:-delvetalk:current}
  restart: unless-stopped
  user: "10425:10425"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m,uid=10425,gid=10425
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  init: true
  stop_grace_period: 30s
  environment:
    DELVETALK_ORIGIN: ${DELVETALK_ORIGIN:-https://gsb.fg-goose.online}  # .env names the portal for every program (transport/identity.py ORIGIN)
  volumes:
    # The clients (front, bridge, interpreter) mount state/ only: serve's
    # directory (town.journal, journal.lock, scratch/, library/, host.sock) and
    # their own files (identity.sqlite, outbox/, observe.sqlite, interpretations/,
    # pid files). The host and ops mount all of /data. A host path, not a named
    # volume, as the edge keeps /var/lib/dregg/<service>: it is what
    # deploy/backup.sh reads.
    - ${DELVETALK_DATA:-/var/lib/delvetalk/v2}/state:/data/state
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  # The single writer: every world's journal and every principal's scratch worlds, in one process.
  delvetalk-host:
    <<: *service
    command: ["delvetalk-obend", "serve", "--state", "/data/state", "--root-socket", "/run/delvetalk-root/root.sock",
              "--opener", "${DELVETALK_OPENER:-did:plc:6amo7col5h4ciq2gpm5eur7b}", "--library", "/app/world/lib"]
    network_mode: none  # unix sockets only: the host never opens a network connection
    volumes:
      - ${DELVETALK_DATA:-/var/lib/delvetalk/v2}:/data
      - ${DELVETALK_ROOT:-/var/lib/delvetalk/root}:/run/delvetalk-root
    # Replay at a world's first op recompiles every created object (~0.2 to 1 s
    # each); a world idle ten minutes is closed and reopened by replay. The old
    # systemd unit's measured need was about 62 MiB RSS for a tiny world.
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      # The question only a live host can answer: its journal height from world-status
      # (the host has no height when world-open refused the journal).
      test: ["CMD", "python3", "-c", "import sys; from transport.host import HostClient; sys.exit(not isinstance(HostClient('/data/state/host.sock').send({'op': 'world-status'}).get('height'), int))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # The HTTP front: /AGENTS.md for agents, / and /o/<object> for people.
  # 0.0.0.0 inside the container; the port mapping binds the private address
  # only. --trust-proxy keys the unauthenticated limits on the last
  # X-Forwarded-For entry, which Caddy on the anchor sets; anything else on
  # 10.10.1.0/24 that reaches :8765 directly can choose that entry.
  delvetalk-http:
    <<: *service
    command:
      - python3
      - -m
      - transport.http
      - --state
      - /data/state
      - --bind
      - 0.0.0.0
      - --port
      - "8765"
      - --origin
      - ${DELVETALK_ORIGIN:-https://gsb.fg-goose.online}
      - --trust-proxy
    environment:
      DELVETALK_ORIGIN: ${DELVETALK_ORIGIN:-https://gsb.fg-goose.online}  # the repository's did:web host
      DELVETALK_REPO_KEY_FILE: /run/secrets/repo_key  # the town's signing key (docs/REPO.md "The key")
    secrets: [repo_key]
    ports:
      - "${DELVETALK_PRIVATE_IP:-10.10.1.10}:8765:8765/tcp"
    depends_on:
      delvetalk-host: { condition: service_healthy }
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      # The question a visitor asks first, then the one only a live host can
      # answer: /AGENTS.md is served without the host, so a broken chain would
      # still pass it; the home page shows the journal height from world-status
      # as `entry <n>` (pages.html), and `entry None` when world-open refused the journal.
      test: ["CMD", "python3", "-c", "import re,urllib.request as u; u.urlopen('http://127.0.0.1:8765/AGENTS.md', timeout=5).read(); assert re.search(rb'class=.code.>entry [0-9]+<', u.urlopen('http://127.0.0.1:8765/', timeout=30).read())"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Observe the town, run a turn per new spell or reply, write drafts to
  # /data/state/outbox. Reads the AppView and PDS only: transport/delve.py
  # refuses every non-GET unless built for post.py, and no posting
  # credential is mounted here.
  delvetalk-bridge:
    <<: *service
    command: ["python3", "-m", "transport.bridge", "run", "--state", "/data/state", "--poll", "60"]
    depends_on:
      delvetalk-host: { condition: service_healthy }
    mem_limit: 1g
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      # daemon() touches its pid file after every finished step: older than
      # three polls means the loop is stuck, even if the process is alive.
      test: ["CMD", "python3", "-c", "import os,sys,time; p='/data/state/bridge.pid'; os.kill(int(open(p).read()), 0); sys.exit(time.time() - os.stat(p).st_mtime > 180)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Pending interpretation requests -> one model call each -> settled.
  delvetalk-interpret:
    <<: *service
    profiles: ["town"]
    command: ["python3", "-m", "transport.interpret", "run", "--state", "/data/state", "--poll", "60"]
    environment:
      DELVETALK_ORIGIN: ${DELVETALK_ORIGIN:-https://gsb.fg-goose.online}
      DELVETALK_ANTHROPIC_KEY_FILE: /run/secrets/anthropic_key
      DELVETALK_MODEL_THINKING: "off"  # cheap deterministic JSON calls (docs/GENESIS.md)
    secrets: [anthropic_key]
    mem_limit: 1g
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys,time; p='/data/state/interpret.pid'; os.kill(int(open(p).read()), 0); sys.exit(time.time() - os.stat(p).st_mtime > 180)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Operator commands, never started by `up`; the root socket is mounted here:
  #   docker compose run --rm delvetalk-ops python3 -m deploy.genesis --root-socket /run/delvetalk-root/root.sock
  #   docker compose run --rm delvetalk-ops python3 -m transport.bridge outbox --state /data/state
  delvetalk-ops:
    <<: *service
    profiles: ["ops"]
    restart: "no"
    command: ["python3", "-c", "print('give a command')"]
    environment:
      DELVETALK_ORIGIN: ${DELVETALK_ORIGIN:-https://gsb.fg-goose.online}
      DELVETALK_OPENER: ${DELVETALK_OPENER:-did:plc:6amo7col5h4ciq2gpm5eur7b}
      DELVETALK_STATE: /data/state
      DELVETALK_ROOT_SOCKET: /run/delvetalk-root/root.sock
    volumes:
      - ${DELVETALK_DATA:-/var/lib/delvetalk/v2}:/data
      - ${DELVETALK_ROOT:-/var/lib/delvetalk/root}:/run/delvetalk-root

secrets:
  repo_key:
    # deploy/repokey.py made it at first start (docs/DEPLOY.md): 0400, owner 10425, in a 0700 directory.
    file: ${DELVETALK_REPO_KEY_PATH:-/etc/delvetalk/repo/town.key}
  anthropic_key:
    # Outside the repository and outside /data, readable by uid 10425 only.
    file: ${DELVETALK_ANTHROPIC_KEY_PATH:-/etc/delvetalk/anthropic.key}
