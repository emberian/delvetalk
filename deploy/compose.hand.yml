# deploy/compose.hand.yml: the owner's console (docs/DEPLOY.md, "Open the hand") laid over compose.yml.
# In /opt/delvetalk/.env (mode 0600):
#
#   COMPOSE_FILE=compose.yml:compose.hand.yml
#
# The token is a file, /etc/delvetalk/hand.token (owner 10425, mode 0400), read by the hand at start; never an argv
# (`ps` shows argv to every local user) and never .env.
# By default no Delve credential is on the box: the owner posts each draft from his own client and gives the hand its
# link (docs/DEPLOY.md "Posting by hand"). Whoever wants the automatic path puts the credentials file in
# /etc/delvetalk/delve/credentials.json (directory owner 10425, mode 0700; file mode 0400); the hand reads it only when
# the owner clicks Post, so it may be placed after `up`.
# The hand is its own service, never the front on :8765: `transport hand serve` listens on :8766, published on the
# workhorse's loopback (an ssh forward to 127.0.0.1:8766, the token asked once) and on its private address, where the
# anchor's Caddy alone reaches it, behind its password, setting the token itself (docs/DEPLOY.md "Open the hand"). It
# alone of the long-running services mounts the root socket: it speaks as the opener (docs/ROOT.md section 1.4).

services:
  delvetalk-hand:
    image: ${DELVETALK_IMAGE:?set DELVETALK_IMAGE in instance .env}
    restart: unless-stopped
    user: "10425:10425"  # serve's uid: both of its sockets are 0600 (umask 0177), so a uid of the hand's own needs root_group set first
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10425,gid=10425
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    init: true
    command: ["python3", "-m", "transport", "hand", "serve"]
    environment:
      DELVETALK_STATE: /data/state
      DELVETALK_ROOT_SOCKET: /run/delvetalk-root/root.sock
      DELVETALK_ORIGIN: ${DELVETALK_ORIGIN:?set DELVETALK_ORIGIN in instance .env}
      DELVETALK_OPENER: ${DELVETALK_OPENER:?set DELVETALK_OPENER in instance .env}
      DELVETALK_HOSTED_ACCOUNTS: ${DELVETALK_HOSTED_ACCOUNTS:?set DELVETALK_HOSTED_ACCOUNTS in instance .env}
      DELVETALK_HAND_BIND: 0.0.0.0
      DELVETALK_HAND_PORT: ${DELVETALK_HAND_PORT:?set DELVETALK_HAND_PORT in instance .env}
      DELVETALK_HAND_TOKEN_FILE: /run/secrets/hand_token
      DELVETALK_CREDENTIALS: /run/delve/credentials.json
    ports:
      - "127.0.0.1:${DELVETALK_HAND_PORT:?set DELVETALK_HAND_PORT in instance .env}:${DELVETALK_HAND_PORT:?set DELVETALK_HAND_PORT in instance .env}/tcp"
      # the anchor's Caddy, behind its password, which sets the token as X-Delvetalk-Hand-Token; the workhorse's
      # firewall (DELVETALK-FRONT) lets the anchor alone reach this address and port
      - "${DELVETALK_PRIVATE_IP:?set DELVETALK_PRIVATE_IP in instance .env}:${DELVETALK_HAND_PORT:?set DELVETALK_HAND_PORT in instance .env}:${DELVETALK_HAND_PORT:?set DELVETALK_HAND_PORT in instance .env}/tcp"
    secrets: [hand_token]
    volumes:
      - ${DELVETALK_DATA:?set DELVETALK_DATA in instance .env}/state:/data/state
      - ${DELVETALK_ROOT:?set DELVETALK_ROOT in instance .env}:/run/delvetalk-root
      - ${DELVETALK_DELVE_DIR:?set DELVETALK_DELVE_DIR in instance .env}:/run/delve:ro
      # Every data directory, read only, at the path a carried genesis cites its ancestors by (compose.yml's host): the
      # overview reads the day across the carry (transport/overview.py `ancestors`).
      - ${DELVETALK_TOWNS:?set DELVETALK_TOWNS in instance .env}:/towns:ro
    depends_on:
      delvetalk-host: { condition: service_healthy }
    healthcheck:
      # The hand answers a tokenless /hand/ with 404 and nothing else; any other answer, or none, is unhealthy.
      test: ["CMD", "python3", "-m", "transport", "status", "--health", "hand"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # The automatic moderation (docs/ROOT.md 2.4, docs/DEPLOY.md "Automatic moderation"): residents' public texts screened
  # after they are admitted, on the root socket as the opener (a moderation act is the opener's), the classifier Z.ai's
  # GLM with its own key and its own day of calls. It alone holds the Z.ai key; nothing else mounts it.
  delvetalk-automod:
    image: ${DELVETALK_IMAGE:?set DELVETALK_IMAGE in instance .env}
    restart: unless-stopped
    user: "10425:10425"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10425,gid=10425
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    init: true
    command: ["python3", "-m", "transport", "automod"]
    environment:
      DELVETALK_STATE: /data/state
      DELVETALK_ROOT_SOCKET: /run/delvetalk-root/root.sock
      DELVETALK_ORIGIN: ${DELVETALK_ORIGIN:?set DELVETALK_ORIGIN in instance .env}
      DELVETALK_OPENER: ${DELVETALK_OPENER:?set DELVETALK_OPENER in instance .env}
      DELVETALK_ZAI_KEY_FILE: /run/secrets/zai_key
    secrets: [zai_key]
    volumes:
      - ${DELVETALK_DATA:?set DELVETALK_DATA in instance .env}/state:/data/state
      - ${DELVETALK_ROOT:?set DELVETALK_ROOT in instance .env}:/run/delvetalk-root
    depends_on:
      delvetalk-host: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-m", "transport", "status", "--health", "automod"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

secrets:
  zai_key:
    # Outside the repository and outside /data, owner 10425, mode 0400 (docs/DEPLOY.md "Automatic moderation").
    file: ${DELVETALK_ZAI_KEY_PATH:?set DELVETALK_ZAI_KEY_PATH in instance .env}
  hand_token:
    file: ${DELVETALK_HAND_TOKEN_PATH:?set DELVETALK_HAND_TOKEN_PATH in instance .env}
