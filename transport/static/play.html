<!-- page: an object as the logged-in principal sees it; the card is world-card's text, unchanged -->
<h1>{name}</h1>{said}<section><div class="card">{card}</div></section>{doors}
<section><h3>Reply</h3><form method="post" action="/play/{path}"><textarea name="text" rows="5" placeholder="a spell, or what you mean in your own words"></textarea><button>Send</button></form>
<form method="post" action="/play/{path}"><input type="hidden" name="text" value="delvetalk {name} ?"><button>? usage</button></form></section>
<!-- doors -->
<section><h3>Doors</h3><ul>{items}</ul></section>
<!-- door -->
<li><a href="/play/{href}">{label}</a> {description}</li>
<!-- said: the turn the reply ran, and what came back to you -->
<section class="{cls}"><h3>{line}</h3>{offers}</section>
<!-- offer -->
<div class="card">{text}</div>
